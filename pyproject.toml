[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-ml"
version = "0.1.0"
description = "Slackのメンバー活性化MLプロダクト（離脱予兆検知・つなぎ推薦・モデルの見守り）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "duckdb>=1.0",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slack_ml = ["sql/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]